<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>おぢやクエスト</title>

<style>
/* Layout: one pixel screen (15×11 tiles, DQ-style black windows) above a thumb-sized D-pad. Single dark look by choice. */
:root{
  --bg:#0c0e18; --line:#f3f0ff; --ink:#f3f0ff; --dim:#8d93b8;
  --gold:#ffd25e; --hurt:#ff8a5c; --key:#20253f; --keyline:#4c5584;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 22px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#screen{position:relative;width:100%;aspect-ratio:15/11;background:#000;border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:0 0 0 2px #000,0 0 0 4px var(--keyline)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.win{position:absolute;background:#000;color:var(--ink);border:2px solid var(--line);border-radius:7px;box-shadow:0 0 0 2px #000;font-size:clamp(11px,3.6vw,17px);font-size:min(4.1cqw,19px);line-height:1.55;padding:.35em .7em;z-index:5}
#msg{left:2.5%;right:2.5%;bottom:3%;height:35%;white-space:pre-wrap;overflow:hidden;cursor:pointer}
#msgMore{position:absolute;right:.6em;bottom:.15em;animation:blink 1s steps(1) infinite}
#stat{left:2.5%;top:3.5%;min-width:27%;line-height:1.35}
#stat .nm{border-bottom:2px solid var(--line);margin-bottom:.15em;padding-bottom:.1em;white-space:nowrap}
#stat .row{display:flex;justify-content:space-between;gap:.6em;font-variant-numeric:tabular-nums}
#stat.low{color:var(--hurt);border-color:var(--hurt)}
#ehp{right:2.5%;top:3.5%;min-width:36%;max-width:48%;line-height:1.35}
#ehp .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ehp .row{display:flex;justify-content:space-between;gap:.6em;font-variant-numeric:tabular-nums}
#ehp .bar{height:.45em;margin-top:.2em;background:#2a2d40;border:1px solid var(--dim);border-radius:2px;overflow:hidden}
#ehp .bar i{display:block;height:100%;background:#5fd36a;transition:width .3s}
#ehp.mid .bar i{background:var(--gold)}#ehp.low .bar i{background:var(--hurt)}
#menu{right:2.5%;top:3.5%;min-width:40%;max-height:76%;overflow-y:auto}
#menu.bcmd{left:2.5%;right:2.5%;top:auto;bottom:3%;display:grid;grid-template-columns:1fr 1fr;column-gap:1em;max-height:none}
#menu.bsub{top:auto;bottom:3%;right:2.5%}
#menu.tmenu{left:50%;right:auto;top:auto;bottom:7%;transform:translateX(-50%);min-width:44%}
.mtitle{grid-column:1/-1;color:var(--dim);border-bottom:1px solid var(--dim);margin-bottom:.15em;font-size:.86em}
.mi{display:flex;gap:.25em;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;line-height:1.55}
.mi:focus-visible{outline:1px dashed var(--gold)}
.mi .cur{visibility:hidden;width:.9em;flex:none}
.mi.on .cur{visibility:visible;animation:blink 1s steps(1) infinite}
.mi .r{margin-left:auto;padding-left:1em;color:var(--dim);font-variant-numeric:tabular-nums}
.mi[aria-disabled="true"] .lbl{color:var(--dim)}
#info{left:6%;right:6%;top:5%;max-height:90%;overflow:auto;cursor:pointer}
#info .g{display:grid;grid-template-columns:auto auto;column-gap:1.4em;font-variant-numeric:tabular-nums}
#info .g span:nth-child(even){text-align:right}
#info h3{margin:0 0 .2em;font-weight:400;color:var(--gold);font-size:1em}
#area{position:absolute;left:2.5%;top:3.5%;z-index:4;background:rgba(0,0,0,.72);border:1px solid rgba(243,240,255,.5);border-radius:5px;padding:.1em .55em;font-size:min(3.4cqw,15px);pointer-events:none}
#logo{position:absolute;left:0;right:0;top:9%;text-align:center;z-index:4;pointer-events:none}
#logo .t1{font-size:min(6cqw,26px);color:#fff;letter-spacing:.3em;text-shadow:2px 2px 0 #000}
#logo .t2{font-size:min(14cqw,66px);color:var(--gold);letter-spacing:.06em;line-height:1.05;text-shadow:3px 3px 0 #7a2a14,6px 6px 0 #000}
#logo .t3{margin-top:.4em;font-size:min(3.8cqw,17px);color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:.1em}
#mapwin{position:absolute;inset:0;background:#000;z-index:8;display:grid;place-items:center;cursor:pointer}
#mapwin canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:6% 50%;image-rendering:pixelated}
#mapwin .src{position:absolute;right:2%;bottom:10%;width:33%;font-size:min(2.1cqw,10px);line-height:1.4;color:var(--dim)}
#mapwin .legend{position:absolute;right:2%;top:3%;width:33%;font-size:min(2.9cqw,13px);line-height:1.45;color:var(--ink)}
#mapwin .legend h4{margin:0 0 .2em;font-weight:400;color:var(--gold);font-size:1em}
#mapwin .legend div{display:flex;justify-content:space-between;gap:.4em;border-bottom:1px dotted rgba(141,147,184,.4)}
#mapwin .legend span:last-child{color:var(--gold);white-space:nowrap}
#mapwin .cap{position:absolute;right:2%;bottom:2%;font-size:min(3.2cqw,14px);color:var(--dim)}
#pad{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,min(16vw,62px));grid-template-rows:repeat(3,min(16vw,62px));gap:4px}
.k{background:var(--key);border:2px solid var(--keyline);color:var(--ink);border-radius:10px;font:inherit;font-size:20px;display:grid;place-items:center;touch-action:none;cursor:pointer;padding:0}
.k.down{background:var(--keyline)}
.k:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.dpad .c{grid-area:2/2;background:transparent;border-color:transparent}
.ab{display:flex;gap:14px;align-items:center}
.ab .k{width:min(19vw,74px);height:min(19vw,74px);border-radius:50%;font-size:22px}
.ab .a{transform:translateY(-16px);border-color:var(--gold)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--dim);font-size:13px;flex-wrap:wrap}
#snd{background:none;border:1px solid var(--keyline);color:var(--dim);border-radius:6px;font:inherit;padding:.25em .7em;cursor:pointer}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mi.on .cur,#msgMore{animation:none}}
</style>

<div id="app">

</div>

/* ---------- 描画 ---------- */
function balloon(g,x,y,s,c1,c2){EL(g,c1,x,y,6*s,7*s);EL(g,c2,x,y,2.2*s,7*s);g.strokeStyle='rgba(30,20,10,.8)';g.lineWidth=.6;g.beginPath();g.moveTo(x-4*s,y+5*s);g.lineTo(x-1.5*s,y+9*s);g.moveTo(x+4*s,y+5*s);g.lineTo(x+1.5*s,y+9*s);g.stroke();px(g,'#6e4c2a',x-1.5*s,y+9*s,3*s,2.4*s)}
const BAL=[['#e8463a','#ffd25e'],['#3a7be8','#ffffff'],['#ffd25e','#e8463a'],['#3fb37a','#ffffff'],['#9b59d0','#ffd25e'],['#ff8a3c','#3a7be8']];
function drawBalloons(t,n,speed){for(let i=0;i<n;i++){const s=i%3===0?1.4:1;const y=176+30-((t*speed*(0.6+(i%4)*.15)+i*67)%240);const x=(i*53+Math.sin(t/1400+i)*8+20)%240;balloon(ctx,x,y,s,...BAL[i%BAL.length])}}
function drawField(t){
  const f=(t/420|0)%2;
  let cx=Math.round(S.rx*TS+8-VW*TS/2),cy=Math.round(S.ry*TS+8-VH*TS/2);
  cx=clamp(cx,0,W*TS-VW*TS);cy=clamp(cy,0,H*TS-VH*TS);
  const x0=Math.floor(cx/TS),y0=Math.floor(cy/TS);
  for(let y=y0;y<=y0+VH;y++)for(let x=x0;x<=x0+VW;x++){if(x>=W||y>=H)continue;ctx.drawImage(tileImg(x,y,f),x*TS-cx,y*TS-cy)}
  if(!S.f.clear){const sx=SUM[0]*TS-cx+8,sy=SUM[1]*TS-cy;if(sx>-40&&sx<280&&sy>-40&&sy<220){[[0,-6,12,6],[-9,-3,8,5],[9,-3,8,5]].forEach(([dx,dy,rx,ry])=>EL(ctx,'rgba(52,44,80,.9)',sx+dx,sy+dy,rx,ry))}}
  ctx.font='9px DotGothic16, monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const k in LOC){const sv=SVC[LOC[k].id];if(!sv)continue;const[lx,ly]=k.split(',').map(Number);const bx=lx*TS-cx+8,by=ly*TS-cy-5;if(bx<-30||bx>270||by<-10||by>190)continue;
    const w=Math.ceil(ctx.measureText(sv).width)+6;ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(Math.round(bx-w/2),by-6,w,12);ctx.strokeStyle='#ffd25e';ctx.lineWidth=1;ctx.strokeRect(Math.round(bx-w/2)+.5,by-5.5,w-1,11);ctx.fillStyle='#ffd25e';ctx.fillText(sv,bx,by+.5)}
  const hx=Math.round(S.rx*TS-cx),hy=Math.round(S.ry*TS-cy);
  const fr=moving?((t/110|0)%2):0;
  const img=TI.hero[S.dir==='left'||S.dir==='right'?'side':S.dir][fr];
  if(S.dir==='left'){ctx.save();ctx.translate(hx+16,hy);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore()}else ctx.drawImage(img,hx,hy);
  if(!S.f.clear){
    ctx.fillStyle='rgba(28,32,62,.3)';ctx.fillRect(0,0,240,176);
    if(!RM){ctx.strokeStyle='rgba(190,205,240,.45)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<34;i++){const x=(i*71+t*.05)%250-5,y=(i*37+t*.32)%186-5;ctx.moveTo(x,y);ctx.lineTo(x-2,y+6)}ctx.stroke()}
  }
}
const BGS={1:['#6aa0d8','#5d9e45'],2:['#5f74a8','#7a8a4a'],3:['#4c4a6e','#6b5a45'],4:['#2a2c48','#c8d4e6'],5:['#9fb6d8','#e9eef6'],boss:['#1e1a30','#3a3550']};
let ehpKey='';
function updEhp(){const el=$('#ehp');if(scene!=='battle'||!B||!B.E){if(!el.hidden){el.hidden=true;ehpKey=''}return}
  const E=B.E,k=E.n+E.hp+'/'+E.mhp;if(k===ehpKey&&!el.hidden)return;ehpKey=k;const r=E.hp/E.mhp;
  el.innerHTML=`<div class="nm">${E.n}</div><div class="row"><span>HP</span><span>${E.hp} / ${E.mhp}</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,r*100))}%"></i></div>`;
  el.classList.toggle('mid',r<=.5&&r>.25);el.classList.toggle('low',r<=.25);el.hidden=false}
function drawBattle(t){
  const[sky,gr]=BGS[B.zone]||BGS[1];
  const sh=B.shake>t?(Math.random()*6-3|0):0;
  ctx.save();ctx.translate(sh,0);
  ctx.fillStyle=sky;ctx.fillRect(-4,0,248,112);ctx.fillStyle=gr;ctx.fillRect(-4,104,248,80);
  EL(ctx,'rgba(0,0,0,.25)',120,108,46,7);
  if(!S.f.clear&&B.zone!=='boss'){ctx.fillStyle='rgba(28,32,62,.25)';ctx.fillRect(-4,0,248,176)}
  const E=B.E,img=enemySprite(E.key),sc=E.boss||E.big?2.6:2.2,w=40*sc;
  const bob=RM?0:Math.sin(t/300)*1.5;
  let alpha=1;if(B.fade){alpha=Math.max(0,1-(t-B.fade)/500)}
  const blink=B.flash>t&&((t/60|0)%2);
  if(!blink&&alpha>0){ctx.globalAlpha=alpha;ctx.drawImage(img,Math.round(120-w/2),Math.round(110-w+bob),w,w);ctx.globalAlpha=1}
  ctx.restore();
  if(B.hurt>t){ctx.fillStyle='rgba(255,70,60,.28)';ctx.fillRect(0,0,240,176)}
}
function drawTrans(t){
  drawField(t);const p=clamp((t-B.t0)/400,0,1);ctx.fillStyle='#000';
  for(let i=0;i<11;i++){const w=240*p;ctx.fillRect(i%2?240-w:0,i*16,w,16)}
}
function drawTitle(t){
  const g=ctx,gd=g.createLinearGradient(0,0,0,176);gd.addColorStop(0,'#1a1f4a');gd.addColorStop(.6,'#8a5a8a');gd.addColorStop(1,'#f0a070');
  g.fillStyle=gd;g.fillRect(0,0,240,176);
  const r=mul(5);for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${.3+r()*.6})`;g.fillRect(r()*240|0,r()*80|0,1,1)}
  g.fillStyle='#3a3460';g.beginPath();g.moveTo(0,176);for(let x=0;x<=240;x+=4)g.lineTo(x,120-18*Math.sin(x/38)-10*Math.sin(x/15));g.lineTo(240,176);g.fill();
  if(!RM)drawBalloons(t,6,.018);else drawBalloons(0,6,0);
  g.fillStyle='#231f3e';g.beginPath();g.moveTo(0,176);for(let x=0;x<=240;x+=4)g.lineTo(x,140-8*Math.sin(x/22+1));g.lineTo(240,176);g.fill();
  g.fillStyle='#6f86c8';g.beginPath();g.moveTo(96,176);g.quadraticCurveTo(120,150,112,140);g.lineTo(122,140);g.quadraticCurveTo(136,152,132,176);g.fill();
}
let lastT=0;
function loop(t){
  if(scene==='field'||scene==='ending'){
    if(scene==='field'&&!moving&&!busy&&!ui.handler&&held())tryMove(held());
    if(moving){const p=Math.min(1,(t-moving.t0)/STEP);S.rx=moving.fx+(moving.tx-moving.fx)*p;S.ry=moving.fy+(moving.ty-moving.fy)*p;if(p>=1){S.x=moving.tx;S.y=moving.ty;S.rx=S.x;S.ry=S.y;moving=null;onStep()}}
    drawField(t);
    if(scene==='ending')drawBalloons(t-(B?B.t0:0),8,.03);
  }else if(scene==='trans')drawTrans(t);
  else if(scene==='battle')drawBattle(t);
  else if(scene==='title')drawTitle(t);
  updEhp();
  if(mapOpen)drawMap(t);
  requestAnimationFrame(loop);
}

function start(data){

}
window.claude?.hot?.snapshot?.(()=>({S:(scene==='field'&&S)?{...S,x:moving?moving.tx:S.x,y:moving?moving.ty:S.y}:null}));
const boot=()=>window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
(document.fonts&&document.fonts.load?document.fonts.load('16px DotGothic16').catch(()=>{}):Promise.resolve()).then(boot,boot);
})();
